<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayGround</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #f8fafc; }
  main { text-align: center; padding: 2rem; }
  h1 { font-size: 2.5rem; margin: 0 0 0.5rem; }
  p { color: #94a3b8; }
  button { font-size: 1rem; padding: 0.6rem 1.2rem; border-radius: 0.5rem; border: 0; cursor: pointer; }
</style>
</head>
<body>
<main>
<h1>PlayGround</h1>
<p>Static preview is running.</p>
<button id="count" type="button">Clicked 0 times</button>
</main>
<script>
let n = 0;
document.getElementById('count').addEventListener('click', (e) => {
  n += 1;
  e.target.textContent = 'Clicked ' + n + ' times';
});
</script>
</body>
</html>
